name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install strictdoc
    
    - name: Generate documentation for example1
      run: |
        cd examples/example1
        mkdir -p docs
        mkdir -p .strictdoc_cache
        strictdoc export . --output-dir docs --formats html
    
    - name: Generate documentation for example2
      run: |
        cd examples/example2
        mkdir -p docs
        mkdir -p .strictdoc_cache
        mkdir -p docs/html/example2
        # Generate basic HTML for existing documents
        for file in *.sdoc; do
          if [ -f "$file" ]; then
            strictdoc export "$file" --output-dir docs --formats html
          fi
        done
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: . 