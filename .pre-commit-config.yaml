repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-json
    -   id: check-added-large-files
    -   id: check-merge-conflict
    -   id: check-case-conflict
    -   id: check-docstring-first

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.2.1
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
    -   id: ruff-format

-   repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
    -   id: prettier
        types_or: [yaml, json]
        additional_dependencies:
        - prettier@4.0.0-alpha.8

-   repo: local
    hooks:
    -   id: strictdoc-validator
        name: StrictDoc Grammar Validator
        entry: python scripts/validate_strictdoc.py
        language: python
        types: [text]
        files: \.sdoc$
        pass_filenames: true
        require_serial: true
    -   id: strictdoc-uid-uniqueness
        name: StrictDoc UID Uniqueness Validator
        entry: python scripts/validate_uid_uniqueness.py
        language: python
        types: [text]
        files: \.sdoc$
        pass_filenames: false
        require_serial: true
